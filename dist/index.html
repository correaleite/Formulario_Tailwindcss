<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Travel</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-slate-950 text-white font-body p-8">

    <main class="max-w-7xl min-h-dvh bg-white/5 rounded-3xl p-4 mx-auto border border-white/15">

        <header class="flex flex-col items-center justify-between gap-4 lg:flex-row">
            <h1 class="font-title text-4xl font-bold leading-tight md:text-5xl">Space Travel</h1>
            <figure class="flex gap-2"> 
                <img src="./images/astro01.jpg" alt="Astronauta 01"
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro02.jpg" alt="Astronauta 02"
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro03.jpg" alt="Astronauta 03"
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro04.jpg" alt="Astronauta 04"
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro05.jpg" alt="Astronauta 05"
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro06.jpg" alt="Astronauta 06"
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro07.jpg" alt="Astronauta 07"
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro08.jpg" alt="Astronauta 08"
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
            </figure>
        </header>

        <form name="form-viagem" id="form-viagem" method="get" action="">
            
            <p class="my-5 font-medium text-cyan-300 text-center text-balance lg:text-left">Preencha os dados abaixo para confirmar sua viagem especial</p>

            <fieldset class="border border-white/10 rounded-2xl bg-white/10 p-4">
                <legend class="font-title text-lg font-bold text-cyan-300 px-2">01. Dados do viajante</legend>

                <section class="grid gap-6 md:grid-cols-2">
                    <div>
                        <label for="nome" class="block ml-2 text-sm mb-2 text-slate-300">Nome completo</label>
                        <input type="text" id="nome" placeholder="Digite o seu nome" minlength="10" maxlength="20" required class="border border-white/10 bg-slate-950/60 w-full rounded-lg px-3 py-3 outline-none focus:border-cyan-400 focus:bg-white/10">
                    </div>
                    <div>
                        <label for="codigo" class="block ml-2 text-sm mb-2 text-slate-300">Código de acesso</label>
                        <input type="text" id="codigo" placeholder="Digite o seu código" minlength="8" maxlength="20" required class="border border-white/10 bg-slate-950/60 w-full rounded-lg px-3 py-3 outline-none focus:border-cyan-400 focus:bg-white/10">
                    </div>
                </section>
            </fieldset>

        </form>

    </main>

</body>
</html>
